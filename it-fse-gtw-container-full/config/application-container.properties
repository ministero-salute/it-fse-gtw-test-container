#######################################################################
# Profilo "container" - comune a tutti i microservizi GTW ed EDS.
#
# Viene attivato insieme al profilo "dev" (SPRING_PROFILES_ACTIVE=dev,container)
# e sovrascrive i soli riferimenti a "localhost" presenti in application-dev,
# sostituendoli con i nomi dei servizi della rete docker-compose.
# Le chiavi non usate da un microservizio vengono semplicemente ignorate.
#######################################################################

# La porta di management coincide sempre con quella applicativa
# (server.port è impostata per ogni servizio tramite SERVER_PORT).
management.server.port=${server.port}

#######################################
#   INFRASTRUTTURA
#######################################
spring.data.mongodb.uri=mongodb://mongo:27017
data.mongodb.uri=mongodb://mongo:27017
transactions.mongodb.uri=mongodb://mongo:27017
valdoc.mongodb.uri=mongodb://mongo:27017
rules.mongodb.uri=mongodb://mongo:27017

kafka.bootstrap-servers=kafka:9092
kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.bootstrap-servers=kafka:9092

#######################################
