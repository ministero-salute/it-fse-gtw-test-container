ms.url.eds-client=http://it-fse-gtw-eds-client:8021
ms.url.eds-client-service=http://it-fse-gtw-eds-client:8021
ms.url.gtw-eds-client-service=http://it-fse-gtw-eds-client:8021

ms.url.gtw-fhir-mapping-engine=http://it-fse-gtw-fhir-mapping-engine:8022
